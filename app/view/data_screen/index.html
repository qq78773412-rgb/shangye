<!DOCTYPE html><!--custom_file(data_screen)-->
<html>
<head>
	<meta charset="utf-8">
	<title>数据大屏</title>
	<meta name="renderer" content="webkit">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
	{include file="public/css"/}
	<style>
		#ggnamediv .layui-input,#ggvaldiv .layui-input{ display:inline;height:30px}
		.disabled{background: #eae9e9}
		.paylist_cursor{cursor: no-drop}
	</style>
</head>
<body>
<div class="layui-fluid">
	<div class="layui-row layui-col-space15">
		<div class="layui-card layui-col-md12">
			<div class="layui-card-header">
				<i class="fa fa-pencil"></i> 数据大屏
<!--				<i class="layui-icon layui-icon-close" style="font-size:18px;font-weight:bold;cursor:pointer" onclick="closeself()"></i>-->
			</div>
			<div class="layui-card-body" pad15>
					<blockquote class="layui-elem-quote">使用前请先登录系统</blockquote>
				<div class="layui-form form-label-w8">
					<div class="layui-form-item">
						<label class="layui-form-label"><span class="redstar">*</span>大屏数据地址：</label>
						<div class="layui-input-inline" style="width:525px;line-height: 40px">
							<a style="color: #1E9FFF" href="{$datascreen_url}" target="_blank">{$datascreen_url}</a>
						</div>
						<div class="layui-form-mid layui-word-aux" style="margin-left:10px;">*复制地址，并在商户登录的浏览器环境下打开链接</div>
					</div>
				

					<div class="layui-form-item">
						<label class="layui-form-label">数据展示标题：</label>
						<div class="layui-input-inline" style="width:300px">
							<input type="text" class="layui-input" name="info[data_screen_title]" value="{$info.data_screen_title}" />
						</div>
						<div class="layui-form-mid layui-word-aux"></div>
					</div>

					<div class="layui-form-item">
						<input type="hidden" name="info[id]" value="{$info.id}">
						<label class="layui-form-label">&nbsp;</label>
						<div class="layui-input-inline">
							<button class="layui-btn" lay-submit lay-filter="formsubmit">保 存</button>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
{include file="public/js"/}
<script>
	layui.form.on('submit(formsubmit)', function(obj){
		var field = obj.field
		//console.log(field);return;
		var index = layer.load();
		$.post("{:url('save')}",field,function(data){
			layer.close(index);
			dialog(data.msg,data.status);
			if(data.status == 1){
				setTimeout(function(){
					window.location.href="{:url('index')}"
				},1000)
			}
		})
	})
</script>
{include file="public/copyright"/}
</body>
</html>
