<!DOCTYPE html><!--custom_file(extend_qrcode)-->
<html>
<head>
  <meta charset="utf-8">
  <title>二维码</title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
  {include file="public/css"/}
</head>
<body>
  <div class="layui-fluid">
    <div class="layui-row layui-col-space15">
        <div class="layui-card layui-col-md12">
          <div class="layui-card-header">
            <i class="fa fa-list"></i> 二维码
            {if input('param.isopen')==1}<i class="layui-icon layui-icon-close" style="font-size:18px;font-weight:bold;cursor:pointer" onclick="closeself()"></i>{/if}
          </div>
          <div class="layui-card-body" pad15>
            <div class="layui-col-md12" style="padding-bottom:10px">
              {if $auth['listdel']}<button class="layui-btn layui-btn-primary layuiadmin-btn-list" onclick="datadel(0)">删除</button>{/if}
              {if $auth['listexcel']}<button class="layui-btn layui-btn-primary layuiadmin-btn-list" data-form-export="{:url('listexcel')}/hid/{$Request.param.hid}">导出</button>{/if}
              {if $auth['listdownload']}<button class="layui-btn layui-btn-primary layuiadmin-btn-list" onclick="download(0)">下载二维码</button>{/if}
            </div>
            <div class="layui-form layui-col-md12 layui-form-search">

              <div class="layui-inline layuiadmin-input-useradmin">
                <label class="layui-form-label">二维码</label>
                <div class="layui-input-inline">
                  <input type="text" name="code" autocomplete="off" class="layui-input" value="">
                </div>
              </div>
              
              <div class="layui-inline layuiadmin-input-useradmin">
                <label class="layui-form-label">分销商ID</label>
                <div class="layui-input-inline">
                  <input type="text" name="pid" autocomplete="off" class="layui-input" value="">
                </div>
              </div>
              <div class="layui-inline">
                <label class="layui-form-label">是否扫码绑定</label>
                <div class="layui-input-inline">
                  <select name="bindstatus">
                    <option value="">全部</option>
                    <option value="0">否</option>
                    <option value="1">是</option>
                  </select>
                </div>
              </div>
              <div class="layui-inline">
                <button class="layui-btn layuiadmin-btn-replys" lay-submit="" lay-filter="LAY-app-forumreply-search">
                  <i class="layui-icon layui-icon-search layuiadmin-button-btn"></i>
                </button>
              </div>
            </div>
            <div class="layui-col-md12">
              <table id="tabledata" lay-filter="tabledata"></table>
            </div>
          </div>
        </div>
    </div>
  </div>
  {include file="public/js"/}
  <script>
  layui.laydate.render({ 
    elem: '#ctime',
    trigger: 'click',
    range: '~' //或 range: '~' 来自定义分割字符
  });
  var table = layui.table;
  var datawhere = {};
  //数据表
  var tableIns = table.render({
    elem: '#tabledata'
    ,url: "{$Request.url}" //数据接口
    ,page: true //开启分页
    ,cols: [[ //表头
      {type:"checkbox"},
      {field: 'id', title: 'ID',width:80},
      //{field: 'code', title: '二维码'},
      {field: 'qrcode', title: '图片',templet:function(d){
        if(d.qrcode){
          return '<img src="'+d.qrcode+'" style="width:100px;" onclick="preview(this)"/>';
        }
        return '';
      }},
      {field: 'name', title: '活动信息',templet:function(d){
        return '活动ID:'+d.qid+' <br>活动名称：'+d.qset.name
      }},
      {field: 'nickname', title: '分销商',templet:function(d){
        if(d.pid && d.parent)
          return '<img src="'+d.parent.headimg+'" style="width:50px"><p style="margin-top:10px"> ID:'+d.pid+' 昵称：' + d.parent.nickname+'</p>';
        else
          return  '<p style="margin-top:10px"> ID:'+d.pid+'</p>';
      }},
      {field: 'bindtime', title: '绑定时间',sort:true,templet:function(d){ 
        if(d.status==1) return date('Y-m-d H:i',d.bindtime);
        return '';
      }},
      {field: 'bindstatus', title: '是否扫码绑定',templet:function(d){
        if(d.bindstatus==0) return '<span style="color:#333">否</span>'
        if(d.bindstatus==1) return '<span style="color:green">是</span>'
        return '';
      }},
      {field: 'op', title: '操作',templet:function(d){
        var html = '';
        {if $auth['listdel']}
          html += '<button class="table-btn" onclick="datadel('+d.id+')">删除</button>';
        {/if}
        return html;
      }}
    ]]
  });

  //排序
  table.on('sort(tabledata)', function(obj){
    datawhere.field = obj.field;
    datawhere.order = obj.type;
    tableIns.reload({
      initSort: obj,
      where: datawhere
    });
  });
  //检索
  layui.form.on('submit(LAY-app-forumreply-search)', function(obj){
    var field = obj.field
    var olddatawhere = datawhere
    datawhere = field
    datawhere.field = olddatawhere.field
    datawhere.order = olddatawhere.order
    tableIns.reload({
      where: datawhere,
      page: {curr: 1}
    });
  })
  //删除
  function datadel(id){
    var ids = [];
    if(id==0){
      var checkStatus = table.checkStatus('tabledata')
      var checkData = checkStatus.data; //得到选中的数据
      if(checkData.length === 0){
         return layer.msg('请选择数据');
      }
      var ids = [];
      for(var i=0;i<checkData.length;i++){
        ids.push(checkData[i]['id']);
      }
    }else{
      ids.push(id)
    }
    layer.confirm('确定要删除吗？删除后无法恢复！',{icon: 7, title:'操作确认'}, function(index){
      //do something
      layer.close(index);
      var index = layer.load();
      $.post("{:url('listdel')}",{ids:ids},function(data){
        layer.close(index);
        dialog(data.msg,data.status);
        tableIns.reload()
      })
    });
  }
  function download(id){
    var ids = [];
    if(id==0){
      var checkStatus = table.checkStatus('tabledata')
      var checkData = checkStatus.data; //得到选中的数据
      if(checkData.length === 0){
         return layer.msg('请选择数据');
      }
      var ids = [];
      for(var i=0;i<checkData.length;i++){
        ids.push(checkData[i]['id']);
      }
    }else{
      ids.push(id)
    }
    layer.confirm('确定要下载吗?',{icon: 7, title:'操作确认'}, function(index){
      layer.close(index);
      var index = layer.load();
      $.post("{:url('listdownload')}"+urlEncode(datawhere),{ids:ids},function(data){
        layer.close(index);
        dialog(data.msg,data.status,data.url)
      })
    });
  }
  </script>
  {include file="public/copyright"/}
</body>
</html>
