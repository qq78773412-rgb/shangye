<!DOCTYPE html><!--custom_file(extend_qrcode)-->
<html>
<head>
  <meta charset="utf-8">
  <title>空码</title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
  {include file="public/css"/}
  <style>
  #urlqr img{margin:0 auto}
  </style>
</head>
<body>
  <div class="layui-fluid">
    <div class="layui-row layui-col-space15">
        <div class="layui-card layui-col-md12">

          <div class="layui-card-header">
            <i class="fa fa-list"></i> 空码列表
            <!-- <i class="layui-icon layui-icon-close" style="font-size:18px;font-weight:bold;cursor:pointer" onclick="closeself()"></i> -->
          </div>

          <div class="layui-card-body" pad15>
            <div class="layui-col-md6" style="padding-bottom:10px">
              <a class="layui-btn layuiadmin-btn-list" href="javascript:void(0)" onclick="openmax('{:url('edit')}')">添加</a>
              <button class="layui-btn layui-btn-primary layuiadmin-btn-list" onclick="datadel(0)">删除</button>
            </div>
            <div class="layui-form layui-col-md6 layui-form-search">
              <div class="layui-inline">
                <label class="layui-form-label">名称</label>
                <div class="layui-input-inline">
                  <input type="text" name="name" autocomplete="off" class="layui-input" value="">
                </div>
              </div>
              <div class="layui-inline">
                <label class="layui-form-label">状态</label>
                <div class="layui-input-inline">
                  <select name="status">
                    <option value="">全部</option>
                    <option value="0">关闭</option>
                    <option value="1">开启</option>
                  </select>
                </div>
              </div>
              <div class="layui-inline">
                <button class="layui-btn layuiadmin-btn-replys" lay-submit="" lay-filter="LAY-app-forumreply-search">
                  <i class="layui-icon layui-icon-search layuiadmin-button-btn"></i>
                </button>
              </div>
            </div>
            <div class="layui-col-md12">
              <table id="tabledata" lay-filter="tabledata"></table>
            </div>

          </div>

        </div>
    </div>
  </div>
  {include file="public/js"/}
  <script>
  layui.laydate.render({ 
    elem: '#ctime',
    trigger: 'click',
    range: '~' //或 range: '~' 来自定义分割字符
  });
  var table = layui.table;
  var datawhere = {};
  //数据表
  var tableIns = table.render({
    elem: '#tabledata'
    ,url: "{$Request.url}" //数据接口
    ,page: true //开启分页
    ,cols: [[ //表头
      {type:"checkbox"},
      {field: 'id', title: 'ID',width:80},
      {field: 'name', title: '名称'},
      {field: 'formurl', title: '链接地址'},
      {field: 'totalcount', title: '空码总数'},
      {field: 'bindcount', title: '已使绑定数'},
      {field: 'status', title: '状态',templet:function(d){ 
        if(d.status==0){
          return '<span style="color:red">关闭</span>';
        }else{
          return '<span style="color:green">已开启</span>';
        }
      }},
      {field: 'operation', title: '操作',width:200,templet:function(d){
        var html = '';
        html += '<button class="table-btn" onclick="openmax(\'{:url('edit')}/id/'+d.id+'\')">编辑</button>';
        html += '<button class="table-btn" onclick="datadel('+d.id+')">删除</button>';
        {if $auth['makecode']} 
        html += '<button class="table-btn" onclick="makecode('+d.id+',\''+d.name+'\')">生成二维码</button>';
        {/if}
        html += '<button class="table-btn" onclick="openmax(\'{:url('list')}/isopen/1/qid/'+d.id+'\')">二维码列表</button>';
        html += '<button class="table-btn" onclick="download(\''+d.id+'\')">下载二维码</button>';
        return html;
      }}
    ]]
  });
  //排序
  table.on('sort(tabledata)', function(obj){
    datawhere.field = obj.field;
    datawhere.order = obj.type;
    tableIns.reload({
      initSort: obj,
      where: datawhere
    });
  });
  //检索
  layui.form.on('submit(LAY-app-forumreply-search)', function(obj){
    var field = obj.field
    var olddatawhere = datawhere
    datawhere = field
    datawhere.field = olddatawhere.field
    datawhere.order = olddatawhere.order
    tableIns.reload({
      where: datawhere,
      page: {curr: 1}
    });
  });
  //删除
  function datadel(id){
    var ids = [];
    if(id==0){
      var checkStatus = table.checkStatus('tabledata')
      var checkData = checkStatus.data; //得到选中的数据
      if(checkData.length === 0){
         return layer.msg('请选择数据');
      }
      var ids = [];
      for(var i=0;i<checkData.length;i++){
        ids.push(checkData[i]['id']);
      }
    }else{
      ids.push(id)
    }
    layer.confirm('确定要删除吗？删除后无法恢复！空码生成的二维码也将被一同删除',{icon: 7, title:'操作确认'}, function(index){
      //do something
      layer.close(index);
      var index = layer.load();
      $.post("{:url('del')}",{ids:ids},function(data){
        layer.close(index);
        dialog(data.msg,data.status);
        tableIns.reload()
      })
    });
  }
  function download(id){
    layer.confirm('确定要下载吗?',{icon: 7, title:'操作确认'}, function(index){
      layer.close(index);
      var index = layer.load();
      $.post("{:url('listdownload')}/qid/"+id+urlEncode(datawhere),{},function(data){
        layer.close(index);
        dialog(data.msg,data.status,data.url)
      })
    });
  }
  //生成二维码
  function makecode(qid,name){
    var html = '<div style="margin:20px auto;">';
    html+='<div class="layui-form" lay-filter="">';
    html+=' <div class="layui-form-item">';
    html+='   <label class="layui-form-label" style="width:150px">名称：</label>';
    html+='   <div class="layui-input-inline" style="width:300px">';
    html+='     <input type="text" class="layui-input" value="'+name+'" disabled="true">';
    html+='   </div>';
    html+=' </div>';
    html+='<div class="layui-form" lay-filter="">';
    html+=' <div class="layui-form-item">';
    html+='   <label class="layui-form-label" style="width:150px">生成数量：</label>';
    html+='   <div class="layui-input-inline" style="width:300px">';
    html+='     <input type="text" name="makecount" value="1" class="layui-input">';
    html+='   </div>';
    html+=' </div>';
    // html+=' <div class="layui-form-item">';
    // html+='   <label class="layui-form-label" style="width:150px">位数：</label>';
    // html+='   <div class="layui-input-inline" style="width:300px">';
    // html+='     <input type="text" name="codelength" value="8" class="layui-input">';
    // html+='   </div><div class="layui-form-mid layui-word-aux">最大10位</div>';
    // html+=' </div>';
    // html+=' <div class="layui-form-item">';
    // html+='   <label class="layui-form-label" style="width:150px">位数类型：</label>';
    // html+='   <div class="layui-input-inline" style="width:300px">';
    // html+='     <input type="radio" name="codetype" value="1" title="纯数字" checked>';
    // html+='     <input type="radio" name="codetype" value="2" title="大小写字母">';
    // html+='     <input type="radio" name="codetype" value="3" title="小写字母">';
    // html+='     <input type="radio" name="codetype" value="4" title="大写字母">';
    // html+='     <input type="radio" name="codetype" value="5" title="数字+小写字母">';
    // html+='     <input type="radio" name="codetype" value="6" title="数字+大写字母">';
    // html+='   </div>';
    // html+=' </div>';
    html+=' <div class="layui-form-item">';
    html+='   <label class="layui-form-label" style="width:150px">类型：</label>';
    html+='   <div class="layui-input-inline" style="width:300px">';
    // html+='     <input type="radio" name="qrtype" value="1" title="二维码">';
    // html+='     <input type="radio" name="qrtype" value="2" title="条形码">';
    html+='     <input type="radio" name="qrtype" value="3" checked title="H5二维码">';
    html+='     <input type="radio" name="qrtype" value="4" title="小程序码">';
    html+='   </div>';
    html+=' </div>';
    html+=' <div class="layui-form-item">';
    html+='   <label class="layui-form-label" style="width:150px">绑定分销商ID：</label>';
    html+='   <div class="layui-input-inline" style="width:300px">';
    html+='     <input type="text" name="pid" value="" placeholder="选填（若想用扫码绑定，这里留空)" class="layui-input">';
    html+='   </div>';
    html+=' </div>';
    html+=' <div class="layui-form-item">';
    html+='   <label class="layui-form-label" style="width:150px">扫码绑定分销商：</label>';
    html+='   <div class="layui-input-inline" style="width:300px">';
    html+='     <input type="radio" name="bindstatus" value="1" title="开启"/>';
    html+='     <input type="radio" name="bindstatus" value="0" checked title="关闭"/>';
    html+='   </div><div class="layui-form-mid" style="margin-left:100px">开启后未绑定分销商的二维码被符合条件的分销商扫码后将自动绑定，已填写绑定分销商ID扫码不起效果</div>';
    html+=' </div>';
    html+=' <div class="layui-form-item" style="margin-top:30px">';
    html+='   <label class="layui-form-label" style="width:150px"></label>';
    html+='   <div class="layui-input-inline">';
    html+='     <button class="layui-btn layui-btn-normal" lay-submit lay-filter="submit_excel">生 成</button>';
    html+='   </div>';
    html+=' </div>';
    html+='</div>';
    html+='</div>'
    var makelayer = layer.open({type:1,area: ['600px', '600px'],title:'生成二维码',content:html,shadeClose:true})
    layui.form.render();
    layui.form.on('submit(submit_excel)', function(obj){
      var field = obj.field;
      field.qid = qid;
      var index= layer.load();
      $.post("{:url('makecode')}",field,function(data){
        layer.close(index);
        dialog(data.msg,data.status);
        if(data.status == 1){
          layer.close(makelayer)
          tableIns.reload()
        }
        
      })
    })
  }

  function showurl(id){
    var pagepath = 'pagesA/qrcode/index';
    {if !in_array('mp',$platform)}
    showwxqrcode(pagepath);
    return;
    {/if}
    var url = '{$Think.const.PRE_URL2}/h5/{$aid}.html#'+pagepath;
    var html = '';
    html+='<div style="margin:20px">';
    html+=' <div style="width:100%;margin:10px 0" id="urlqr"></div>'; 
    {if in_array('wx',$platform)}
    html+=' <div style="width:100%;text-align:center"><button class="layui-btn layui-btn-sm layui-btn-primary" onclick="showwxqrcode(\''+pagepath+'\')">查看小程序码</button></div>'; 
    {/if}
    html+=' <div style="height:50px;line-height:25px;" onclick="copyText(\''+url+'\')">链接地址：'+url+'</div>';
    {if in_array('wx',$platform)}
    html+=' <div style="height:50px;line-height:25px;" onclick="copyText(\'/'+pagepath+'\')">小程序路径：/'+pagepath+'</div>';
    {/if}
    html+='</div>'
    layer.open({type:1,'title':'链接地址',area:['500px','430px'],shadeClose:true,'content':html})
    var qrcode = new QRCode('urlqr', {
      text: 'your content',
      width: 200,
      height: 200,
      colorDark : '#000000',
      colorLight : '#ffffff',
      correctLevel : QRCode.CorrectLevel.L
    });
    qrcode.clear();
    qrcode.makeCode(url);
  }
  function showwxqrcode(pagepath){
    var index = layer.load();
    $.post("{:url('DesignerPage/getwxqrcode')}",{path:pagepath},function(res){
      layer.close(index);
      if(res.status==0){
        //dialog(res.msg);
        layer.open({type:1,area:['300px','350px'],content:'<div style="margin:auto auto;text-align:center"><div style="color:red;width:280px;height:180px;margin-top:100px">'+res.msg+'</div><div style="height:25px;line-height:25px;">'+pagepath+'</div></div>',title:false,shadeClose:true})
      }else{
        layer.open({type:1,area:['300px','350px'],content:'<div style="margin:auto auto;text-align:center"><img src="'+res.url+'" style="margin-top:20px;max-width:280px;max-height:280px"/><div style="height:25px;line-height:25px;">'+pagepath+'</div></div>',title:false,shadeClose:true})
      }
    })
  }
  function copyText(text) {
    return;
      var textarea = document.createElement("textarea"); //创建input对象
      var currentFocus = document.activeElement; //当前获得焦点的元素
      var toolBoxwrap = document.getElementById('NewsToolBox'); //将文本框插入到NewsToolBox这个之后
      toolBoxwrap.appendChild(textarea); //添加元素
      textarea.value = text;
      textarea.focus();
      if (textarea.setSelectionRange) {
          textarea.setSelectionRange(0, textarea.value.length); //获取光标起始位置到结束位置
      } else {
          textarea.select();
      }
      try {
          var flag = document.execCommand("copy"); //执行复制
      } catch (eo) {
          var flag = false;
      }
      toolBoxwrap.removeChild(textarea); //删除元素
      currentFocus.focus();
      if(flag) layer.msg('复制成功');
      return flag;
  }
  </script>
  {include file="public/copyright"/}
</body>
</html>
